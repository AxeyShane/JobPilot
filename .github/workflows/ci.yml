name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (new-capability modules)
        run: ruff check src/jobpilot/gating.py src/jobpilot/outcomes.py src/jobpilot/quality.py src/jobpilot/interview.py src/jobpilot/upskill.py src/jobpilot/scoring/dimensions.py

      - name: Test
        run: pytest tests/ -v
