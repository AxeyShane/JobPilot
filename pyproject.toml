[project]
name = "job-pilot-ai"
version = "0.4.0"
description = "JobPilot - AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Akshay Kharvi"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "flask>=3.0",
    "mcp>=1.0",
    "python-docx>=1.1",
    "crawl4ai>=0.9",
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[project.urls]
Homepage = "https://github.com/Pickle-Pixel/JobPilot"
Repository = "https://github.com/Pickle-Pixel/JobPilot"
Issues = "https://github.com/Pickle-Pixel/JobPilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.hatch.build]
artifacts = ["src/jobpilot/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

# Style-only rules that the codebase (inherited from ApplyPilot) uses heavily
# and that do not affect correctness. Kept as non-blocking to avoid churning
# logic; the tests are the real gate.
[tool.ruff.lint]
ignore = [
    "UP031",   # printf-style % formatting vs f-strings (codebase style)
    "SIM102",  # collapsible if (readability preference)
    "RUF007",  # zip vs itertools.pairwise (codebase style)
    "B008",    # typer.Argument(...) in defaults (required by the CLI framework)
    "BLE001",  # blind except: Exception (intentional graceful degradation)
    "PLR2004", # magic-value comparisons
    "RUF046",  # unnecessary int() cast (codebase style)
    "FLY002",  # static join vs f-string (style)
    "PERF102", # dict .values() iteration (style)
    "SIM103",  # return condition directly (style)
]
